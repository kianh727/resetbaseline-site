name: CI

# SITE-001. This file is what CLAUDE.md §7 means by "the sweep is the CI job
# list, not a number". Adding a check here adds it to the sweep; nothing else
# does. Later issues extend it — SITE-004 the contracts drift guard, SITE-057
# the overflow and touch-target audit, SITE-078 the performance budgets,
# SITE-107 the ban-list check. SITE-106's eval-stub run is already here.
#
# The 120 KB core bundle ceiling is already here, pulled forward from
# SITE-078 by ruling: it costs nothing while the number is 103, and it names
# the commit that adds the first runtime dependency rather than the last.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first; the last commit is the
# one whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: eval-stubs · divergences · lavender · predicates · typecheck · lint · test · timezones · build · bundle · overflow · builder · lcp · links · app-names · motion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails on a lockfile that disagrees with package.json, which is
      # the point — an out-of-date lockfile should stop the build.
      - run: npm ci

      # Each step runs bare and its exit status is the result. Never pipe a
      # check through a filter: a pipeline reports whether the filter
      # succeeded, so a failing check whose output happens not to match looks
      # exactly like a passing one (CLAUDE.md §7).
      # SITE-106. §12.4 made operational: every eval states how it fails against
      # a stub that does nothing, and an eval added without one fails CI rather
      # than review. Runs before the build because it needs no artifacts and a
      # missing stub check should be the first thing anyone hears about.
      - name: Eval stub checks
        run: npm run check:eval-stubs

      # PRD v7.3 §6.6. Nothing generated may read `artifact_divergences`: it
      # records stale counts against current counts in the same object. The ban
      # was prose until the manifest was about to enter the repo; this is the
      # construction behind it.
      # SITE-107. §14's PRE-2, automated: §19's banned terms and the committed
      # app-name list against every authored string, site-wide rather than
      # gate-scoped (§6.3a is a MUST), plus staleness of the list itself. The
      # list ships non-empty -- an empty one fails nothing, which would be §0.3
      # turned on the check written to catch it.
      - name: Banned terms, app names, and list staleness
        run: npm run check:bans

      - name: Divergences ban
        run: npm run check:divergences

      - name: Lavender is light, never paint (§6.3b)
        run: npm run check:lavender

      - name: Predicates enumerate what they accept (§0.3e)
        run: npm run check:predicates

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Date-sensitive suites in real DST zones
        run: npm run check:timezones

      # Chromium comes BEFORE the build, not after, and that is load-bearing
      # rather than tidy: `npm run build` rasterises the share card and the icon
      # set through playwright-core, so a build step ahead of the install fails
      # on a fresh runner while passing on any machine with a browser already
      # cached. It did exactly that here -- green locally, red in CI, three runs
      # in a row -- which is the job-ordering hazard §0.3d warns about, in the
      # workflow rather than in a check.
      - name: Install Chromium — the build rasterises the OG card with it
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      # The static export is what Cloudflare Pages serves. If `out/` is missing
      # the build silently stopped being an export, and every later deploy
      # would serve the previous one.
      - name: Assert static export produced out/
        run: test -d out && test -f out/index.html

      # Routes whose page file is `page.dev.tsx` exist under `npm run dev` and
      # must not be in the export. The list is derived from the source tree,
      # not written down in this file, so adding one cannot leave it
      # unguarded.
      - name: Assert no development route shipped
        run: npm run check:dev-routes

      # The 120 KB core bundle ceiling (PRD v7.3 §11), measured on the
      # exported chunks the entry document actually references. Pulled forward
      # to the first product commits deliberately: a ceiling first checked at
      # the end catches the thirtieth dependency, not the first.
      - name: Core bundle budget
        run: npm run check:bundle

      # SITE-005. Zero horizontal scroll at 320px is a P0 acceptance criterion,
      # and §9 puts it at every width the site supports. This needs a real
      # browser because an overflow is a layout outcome, not something visible
      # in the CSS that caused it.
      - name: Horizontal overflow at 320/375/390/768/1440/1920
        run: npm run check:overflow

      # SITE-015 / SITE-019. The frame renders complete and empty at t=0 with
      # the network blocked (DS-10), and the deadline materialises mid-typing
      # with zero requests (§3.3). Both need a real browser: "no spinner
      # exists" is a claim about the rendered DOM, not about the source.
      - name: Builder guarantees — anti-spinner and live parse
        run: npm run check:builder

      # The environment audit, 2026-09-19. Four source files branch on
      # prefers-reduced-motion and no check ever set it — the timezone finding
      # generalised: a behaviour that only exists in an environment CI never
      # enters is a behaviour CI does not test. Asserts BOTH settings, because
      # checking only the reduced case passes on a site that never animates.
      # SITE-EVAL-052. PRD §6: the headline is the LCP element and the Peak is
      # never in the LCP path. SITE-007 verified this once, in an ad-hoc run
      # that left no artifact — so nothing would have noticed a font, a hero
      # image or the scene displacing the H1. The §12.4 stub audit found it as
      # the one eval with no implementation and an obvious one.
      - name: The headline is the LCP element
        run: npm run check:lcp

      # SITE-098. SP-17's exit criterion: all four routes linked from the
      # footer, no dead link. It reads the exported document and the export's
      # own filesystem — two sources, neither computed from the other — and
      # asserts a link count before asserting resolution, because "no dead
      # links" passes perfectly on a footer with no links (§0.3).
      - name: Footer reaches every route and anchor
        run: npm run check:links

      # §6.3a, a MUST. Screen Time returns opaque tokens, so a gate object
      # naming an app depicts a UI state the product cannot produce. This drives
      # the real flow in a browser rather than scanning for the strings — the
      # chips legitimately carry names, so a scan would ban the rule along with
      # its violation. Counts before properties: it asserts a gate rendered
      # before asserting no name is in it.
      - name: No depicted object names an app
        run: npm run check:app-names

      # SITE-100. Reads the exported documents and the export's own filesystem —
      # two sources, neither computed from the other, since reading the route
      # list that generated the tags would agree by construction (§0.3b). Counts
      # before properties, and it asserts the sitemap in both directions: a
      # sitemap advertising a route that does not exist sends crawlers to a 404,
      # and a route missing from it is a page nobody finds.
      - name: Every route has metadata, an OG card and icons that resolve
        run: npm run check:metadata

      # SITE-051 / SITE-EVAL-039. Compiles a fixture that MUST fail and fails
      # the build if it succeeds -- a compile-time rule with no failing case
      # rejects nothing, and its absence is indistinguishable from its working.
      # The rejection count is derived from the fixture, not a literal: an
      # earlier threshold of five against six attempts hid the one attempt the
      # guard did not catch. Also scans real payloads for any substring of a
      # goal containing a name, a place and a health term.
      - name: No free-form user text can reach an analytics event
        run: npm run check:pii

      # The deployment's real headers, run against the real page. Every other
      # browser check in this sweep loads the export over a permissive local
      # server, so all of them were measuring a more permissive site than the
      # one that ships. This found that Next's export emits its hydration
      # payload as inline scripts, which script-src 'self' blocks outright --
      # a site that renders and does nothing. The policy carries per-build
      # hashes computed from the export, and both the server and this check
      # read the shipped _headers rather than recomputing it.
      # §11.2's budgets, measured under Lighthouse's Slow-4G shape and a 4x CPU
      # slowdown at 375px. This found INP at 640ms against a 200ms ceiling, and
      # located it by comparing against a reduced-motion run. Lighthouse itself
      # is not run here; the three ceilings are what a regression moves and they
      # are measured directly.
      # SITE-059's failure sweep, plus §11's degradation paths. Fifteen
      # combinations: four tiers x two widths, offline, JavaScript disabled,
      # 200% text, and 320px with a plan. Zero dead states, zero spinners, zero
      # broken layouts, each asserted separately because a page that failed to
      # render satisfies all three vacuously. It found that the document
      # extended to twice the viewport in the plan state -- the band's bleed was
      # clipped by the root safety net rather than by its own container, and
      # check:overflow could not see it because it measures the idle page.
      # The machine-readable link between an eval and its implementation, which
      # SITE-106's audit found did not exist -- ten eval IDs appeared across the
      # tree and every one was prose in a comment. The convention is one line,
      # `@implements SITE-EVAL-NNN`, and this asserts every AUTO eval is either
      # implemented or listed in PENDING with a reason. A marker naming a
      # withdrawn ID fails, and so does an eval that is both implemented and
      # still pending -- the same expiry mechanism the SITE-004 exemption uses.
      - name: Every AUTO eval is implemented or pending with a reason
        run: npm run check:eval-coverage

      # SITE-EVAL-013/016/032/043/047/048. Fifty tune operations with every
      # request recorded, a tune accepted mid-animation, the 44x44 floor at
      # 375px with a plan, the full loop by keyboard, and every control named.
      - name: Tuning is local, and the loop is operable
        run: npm run check:interaction

      # v5 §7, P1. Tier A renders the scene, C and D do not (SITE-058, §15),
      # reduced motion draws once and stops, the builder still works with the
      # canvas over the fold, and with WebGL disabled there is no canvas and the
      # loop still completes (DS-6). The scene's 140 kB budget and its exclusion
      # from first load are asserted in check:bundle.
      - name: The Peak costs nothing when it is absent
        run: npm run check:peak

      - name: Every degradation path renders something honest
        run: npm run check:degradation

      - name: LCP, CLS and INP against §11.2
        run: npm run check:perf

      - name: The site works under its production CSP
        run: npm run check:csp

      - name: Reduced motion in both settings, and locale independence
        run: npm run check:motion
